name: Upload YouTube Video to FB Reels

on:
  workflow_dispatch:
    inputs:
      video_id:
        required: true
        type: string
      video_title:
        required: true
        type: string
      channel_id:
        required: true
        type: string
      fb_page_id:
        required: true
        type: string
      token_key:
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp Binary
        run: |
          mkdir -p ~/.local/bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
          chmod +x ~/.local/bin/yt-dlp
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create Cookie File from Secret
        env:
          COOKIES_TEXT: ${{ secrets.COOKIE_YT }}
        run: |
          echo "$COOKIES_TEXT" > ./cookies.txt

      - name: Download Video with yt-dlp
        env:
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          yt-dlp \
            --cookies ./cookies.txt \
            --remote-components ejs:github \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            --merge-output-format mp4 \
            --restrict-filenames \
            -o "%(title)s.%(ext)s" \
            "https://www.youtube.com/watch?v=${VIDEO_ID}"
            
          DOWNLOADED_FILE=$(ls -t *.mp4 | head -n 1)
          echo "VIDEO_FILE=${DOWNLOADED_FILE}" >> $GITHUB_ENV
          
          echo "Berhasil mengunduh: ${DOWNLOADED_FILE}"
          ls -lh "${DOWNLOADED_FILE}"

      - name: Upload to FB Reels
        env:
          FB_PAGE_ID: ${{ inputs.fb_page_id }}
          FB_TOKEN: ${{ inputs.token_key }}
          VIDEO_ID: ${{ inputs.video_id }}
          VIDEO_TITLE: ${{ inputs.video_title }}
        run: |
          set -euo pipefail
          
          FILE_NAME="${VIDEO_FILE}"
          echo "Memproses file: ${FILE_NAME}"
          
          CAPTION=$(echo "$VIDEO_TITLE" | sed 's/"/\\"/g')

          echo "== Start upload session =="
          START_RESP=$(curl -sS -X POST \
            "https://graph.facebook.com/v24.0/${FB_PAGE_ID}/video_reels" \
            -d "upload_phase=start" \
            -d "access_token=${FB_TOKEN}")

          echo "Start response: ${START_RESP}"

          VIDEO_SESSION_ID=$(echo "${START_RESP}" | jq -r '.video_id // empty')
          UPLOAD_URL=$(echo "${START_RESP}" | jq -r '.upload_url // empty')

          if [ -z "${VIDEO_SESSION_ID}" ] || [ -z "${UPLOAD_URL}" ]; then
            echo "Gagal mendapatkan video_id / upload_url"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "${FILE_NAME}")
          echo "File size: ${FILE_SIZE} bytes"

          echo "== Upload binary =="
          UPLOAD_HTTP=$(curl -sS -o upload_resp.json -w "%{http_code}" \
            -X POST "${UPLOAD_URL}" \
            -H "Authorization: OAuth ${FB_TOKEN}" \
            -H "offset: 0" \
            -H "file_size: ${FILE_SIZE}" \
            --data-binary "@${FILE_NAME}")

          echo "Upload HTTP: ${UPLOAD_HTTP}"
          cat upload_resp.json || true

          if [ "${UPLOAD_HTTP}" != "200" ]; then
            echo "Upload binary gagal"
            exit 1
          fi

          echo "== Finish / publish =="
          FINISH_RESP=$(curl -sS -X POST \
            "https://graph.facebook.com/v24.0/${FB_PAGE_ID}/video_reels" \
            -d "access_token=${FB_TOKEN}" \
            -d "video_id=${VIDEO_SESSION_ID}" \
            -d "upload_phase=finish" \
            -d "video_state=PUBLISHED" \
            -d "description=${CAPTION}")

          echo "Finish response: ${FINISH_RESP}"

          echo "== Polling status =="
          for i in $(seq 1 12); do
            sleep 10
            STATUS_RESP=$(curl -sS \
              "https://graph.facebook.com/v24.0/${VIDEO_SESSION_ID}?fields=status&access_token=${FB_TOKEN}")
            echo "Poll ${i}: ${STATUS_RESP}"
            VIDEO_STATUS=$(echo "${STATUS_RESP}" | jq -r '.status.video_status // empty')
            if [ "${VIDEO_STATUS}" = "ready" ]; then
              echo "Video siap."
              break
            fi
          done

          echo "Selesai."
