name: AI News Analyzer

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'Masukkan URL YouTube yang akan dianalisis'
        required: true
        default: 'https://youtube.com/shorts/VxY4OOYCpIw'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies & FFmpeg
      run: |
        npm init -y
        npm install playwright playwright-extra puppeteer-extra-plugin-stealth
        npx playwright install --with-deps chromium
        pip install google-genai
        sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Download Video via Automation
      env:
        YT_URL: ${{ github.event.inputs.youtube_url }}
      run: |
        cat << 'EOF' > automation.js
        const { chromium } = require('playwright');
        const path = require('path');
        (async () => {
        const browser = await chromium.launch({ headless: true });
        const page = await browser.newPage();
        await page.goto('https://media.ytmp3.gg/tools/youtube-shorts-downloader/cvswxo', { waitUntil: 'networkidle' });
        const mp4BtnSelector = '.format-toggle button[data-format="mp4"]';
        await page.waitForSelector(mp4BtnSelector, { state: 'visible', timeout: 10000 });
        await page.click(mp4BtnSelector);
        const checkboxSelector = '#copyright-consent-checkbox';
        await page.waitForSelector(checkboxSelector, { state: 'attached', timeout: 5000 });
        const isChecked = await page.isChecked(checkboxSelector);
        if (!isChecked) {
        await page.click(checkboxSelector);
        }
        await page.fill('#videoUrl', process.env.YT_URL);
        await page.press('#videoUrl', 'Enter');
        await page.waitForSelector('#download-btn', { state: 'visible', timeout: 120000 });
        const downloadPromise = page.waitForEvent('download');
        await page.click('#download-btn');
        const download = await downloadPromise;
        const downloadPath = path.join(__dirname, 'input.mp4');
        await download.saveAs(downloadPath);
        await browser.close();
        })();
        EOF
        node automation.js

    - name: Run Playwright Script
      env:
        YOUTUBE_URL: ${{ github.event.inputs.youtube_url }}
      run: |
        cat << 'EOF' > script.js
        const { chromium } = require('playwright-extra');
        const stealth = require('puppeteer-extra-plugin-stealth')();
        chromium.use(stealth);
        const fs = require('fs');
        (async () => {
        const targetUrl = process.env.YOUTUBE_URL || 'https://youtube.com/shorts/VxY4OOYCpIw';
        const browser = await chromium.launch({ 
        headless: true,
        args: [
        '--no-sandbox', 
        '--disable-setuid-sandbox',
        '--disable-blink-features=AutomationControlled'
        ]
        });
        const context = await browser.newContext({
        viewport: { width: 1280, height: 1000 },
        userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, Gecko) Chrome/122.0.0.0 Safari/537.36',
        locale: 'id-ID'
        });
        const page = await context.newPage();
        try {
        await page.goto('https://www.google.com/aimode', { waitUntil: 'networkidle' });
        const chatInput = page.locator('textarea.ITIRGe, textarea[placeholder="Tanyakan apa saja"]').first();
        await chatInput.waitFor({ state: 'visible', timeout: 5000 });
        const prompt = `
        Saya memiliki video berita berikut:
        ${process.env.YOUTUBE_URL}
        
        Tugas Anda:
        1. Analisis isi video.
        2. Buat intro berita maksimal 15 detik.
        3. Gaya bahasa:
        - Formal
        - Hard News Journalism
        - Objektif
        - Profesional
        - Authority
        - Credible
        
        Buat juga:
        - AI Image Prompt sangat detail
        - Metadata YouTube SEO
        
        Balas HANYA JSON.
        JANGAN menggunakan markdown.
        JANGAN menggunakan tanda \`\`\`
        JANGAN mengembalikan placeholder.
        JANGAN menyalin contoh.
        
        Gunakan schema berikut:
        
        {
          "intro_segment": {
            "voice_over_script": string,
            "ai_image_prompt_with_text": string
          },
          "social_media_metadata": {
            "title": string,
            "description": string,
            "tags": string[],
            "seo_keywords": string[]
          }
        }
        `;
        await chatInput.fill(prompt);
        await chatInput.press('Enter');
        console.log("Menunggu Google AI memproses dan menulis respons...");
        let finalJsonText = "";
        let parsedJson = null;
        const startTime = Date.now();
        const timeoutLimit = 60000;
        
        while (Date.now() - startTime < timeoutLimit) {
        const bodyText = await page.evaluate(() => document.body.innerText);
        const startIdx = bodyText.indexOf('{');
        const endIdx = bodyText.lastIndexOf('}');
        
        if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx) {
        const candidateStr = bodyText.substring(startIdx, endIdx + 1);
        try {
        parsedJson = JSON.parse(candidateStr);
        if (parsedJson.intro_segment && parsedJson.intro_segment.voice_over_script && !parsedJson.intro_segment.voice_over_script.includes("[naskah")) {
        finalJsonText = candidateStr;
        break;
        }
        } catch (e) {
        // Tunggu parsing selesai
        }
        }
        await page.waitForTimeout(2000);
        }
        
        if (!finalJsonText || !parsedJson || parsedJson.intro_segment.voice_over_script.includes("[naskah")) {
        console.log("Peringatan: Gagal memisahkan JSON murni dari layar. Menggunakan template naskah jurnalisme formal.");
        parsedJson = {
        intro_segment: {
        voice_over_script: "Selamat datang di sorotan berita terkini. Kami menyajikan informasi tajam dan tepercaya yang dirangkum khusus untuk mendalami peristiwa hari ini secara mendalam.",
        ai_image_prompt_with_text: "A professional breaking news studio background with glowing cyber elements, dramatic cinematic lighting, vertical 9:16 aspect ratio, ultra-detailed 8k resolution, bold typography overlay reading 'BERITA UTAMA HARI INI' in sharp clean white sans-serif font centered at the bottom."
        },
        social_media_metadata: { title: "Berita Terkini Hari Ini", description: "Analisis berita otomatis terkini.", tags: ["berita", "news"], seo_keywords: ["berita terbaru"] }
        };
        finalJsonText = JSON.stringify(parsedJson, null, 2);
        }
        console.log("\n=================== HASIL RESPONS GOOGLE AI ===================");
        console.log(finalJsonText);
        console.log("===============================================================\n");
        fs.mkdirSync('output', { recursive: true });
        fs.writeFileSync('output/analysis.json', finalJsonText, 'utf8');
        fs.writeFileSync('tts-script.txt', parsedJson.intro_segment.voice_over_script, 'utf8');
        console.log("Naskah TTS berhasil diekstrak ke tts-script.txt");
        } catch (error) {
        console.error("Terjadi error sistem:", error.message);
        process.exit(1);
        } finally {
        await browser.close();
        }
        })();
        EOF
        node script.js

    - name: Generate TTS Audio
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VOICE_NAME: "Aoede"
        LANGUAGE: "id-ID"
        PARA_GAP: "1.0"
      run: |
        mkdir -p output
        python3 << 'PYEOF'
        import os
        import wave
        import struct
        import time
        import textwrap
        from google import genai
        from google.genai import types

        API_KEY = os.environ["GEMINI_API_KEY"]
        VOICE = os.environ["VOICE_NAME"]
        LANGUAGE = os.environ["LANGUAGE"]
        GAP = float(os.environ["PARA_GAP"])
        SAMPLE_RATE = 24000
        CHANNELS = 1
        SAMPLE_WIDTH = 2
        MODEL_NAME = "gemini-3.1-flash-tts-preview"

        print("\n" + "="*70)
        print(" GEMINI TTS - STABLE PRODUCTION MODE ")
        print("="*70)

        with open("tts-script.txt", "r", encoding="utf8") as f:
            raw_text = f.read().strip()

        raw_text = raw_text.replace("[", "").replace("]", "")
        if not raw_text or len(raw_text.split()) < 3:
            raw_text = "Selamat datang di sorotan berita terkini. Mari kita simak informasi selengkapnya secara mendalam."

        print(f"Voice            : {VOICE}")
        print(f"Text to Speak    : {raw_text[:100]}...")

        client = genai.Client(api_key=API_KEY)

        def call_tts(prompt_text):
            return client.models.generate_content(
                model=MODEL_NAME,
                contents=f"Read this text as a professional indonesian news anchor: {prompt_text}",
                config=types.GenerateContentConfig(
                    response_modalities=["AUDIO"],
                    speech_config=types.SpeechConfig(
                        voice_config=types.VoiceConfig(
                            prebuilt_voice_config=types.PrebuiltVoiceConfig(
                                voice_name=VOICE
                            )
                        )
                    )
                )
            )

        success = False
        audio_bytes = b""

        for retry in range(5):
            try:
                response = call_tts(raw_text)
                if response.candidates and response.candidates[0].content.parts:
                    for part in response.candidates[0].content.parts:
                        if hasattr(part, 'inline_data') and part.inline_data:
                            audio_bytes += part.inline_data.data
                        elif hasattr(part, 'bytes') and part.bytes:
                            audio_bytes += part.bytes
                        elif isinstance(part, dict) and 'inline_data' in part:
                            audio_bytes += part['inline_data'].get('data', b'')

                if len(audio_bytes) > 0:
                    print("✓ Audio binary package received successfully.")
                    success = True
                    break
                else:
                    print(f"Retrying ({retry+1}/5): Mengosongkan data stream...")
                    time.sleep(12)
            except Exception as e:
                print(f"Error pada attempt {retry+1}: {e}")
                time.sleep(15)

        if not success or len(audio_bytes) == 0:
            print("Gagal memanggil API TTS. Membuat audio hening cadangan (5 detik)...")
            n = int(SAMPLE_RATE * 5)
            audio_bytes = struct.pack(f"<{n}h", *([0] * n))

        out = "output/audio.wav"
        with wave.open(out, "wb") as wf:
            wf.setnchannels(CHANNELS)
            wf.setsampwidth(SAMPLE_WIDTH)
            wf.setframerate(SAMPLE_RATE)
            wf.writeframes(audio_bytes)

        print(f"✓ Berkas audio selesai dikompilasi di: {out}\n")
        PYEOF

    - name: Generate Thumbnail Image
      run: |
        cat << 'EOF' > generate-images.js
        const { chromium } = require("playwright");
        const fs = require("fs");
        (async () => {
        try {
        const analysis = JSON.parse(fs.readFileSync("output/analysis.json", "utf8"));
        const imagePrompt = analysis.intro_segment.ai_image_prompt_with_text;
        console.log("\n==============================");
        console.log("START GENERATING THUMBNAIL (9:16)");
        console.log("==============================");
        console.log(`Prompt: ${imagePrompt}\n`);
        const browser = await chromium.launch({ headless: true });
        const page = await browser.newPage();
        await page.goto("https://freegen.app/", { waitUntil: "domcontentloaded" });
        await page.selectOption("#aspectRatioSelect", "9:16");
        await page.fill("#prompt", imagePrompt);
        await page.keyboard.press("Enter");
        const imageContainer = page.locator("#imageContainer");
        await imageContainer.waitFor({ timeout: 120000 });
        const img = imageContainer.locator("img");
        const src = await img.getAttribute("src");
        const base64 = src.replace(/^data:image\/[a-z]+;base64,/, "");
        const out = "output/thumbnail.jpg";
        fs.writeFileSync(out, base64, "base64");
        console.log(`✓ Thumbnail sukses disimpan di: ${out}`);
        await browser.close();
        } catch (err) {
        console.error("Gagal melakukan generator gambar:", err.message);
        process.exit(1);
        }
        })();
        EOF
        node generate-images.js

    - name: Compile Video via FFmpeg
      run: |
        mkdir -p output
        mkdir -p release
    
        echo "Mengambil durasi audio..."
        AUDIO_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/audio.wav)
    
        echo "== Membuat intro =="
    
        ffmpeg -y \
          -loop 1 \
          -i output/thumbnail.jpg \
          -i output/audio.wav \
          -vf "scale=1080:1920:force_original_aspect_ratio=decrease,\
          pad=1080:1920:(ow-iw)/2:(oh-ih)/2,\
          setsar=1" \
          -t "$AUDIO_DURATION" \
          -shortest \
          -c:v libx264 \
          -pix_fmt yuv420p \
          -c:a aac \
          -b:a 192k \
          output/intro_segment.mp4
    
        echo "== Normalisasi video utama =="
    
        ffmpeg -y \
          -i input.mp4 \
          -vf "scale=1080:1920:force_original_aspect_ratio=decrease,\
          pad=1080:1920:(ow-iw)/2:(oh-ih)/2,\
          setsar=1" \
          -c:v libx264 \
          -pix_fmt yuv420p \
          -c:a aac \
          -b:a 192k \
          output/main.mp4
    
        echo "== Menggabungkan =="
    
        printf "file 'output/intro_segment.mp4'\nfile 'output/main.mp4'\n" > list.txt
    
        ffmpeg -y \
          -f concat \
          -safe 0 \
          -i list.txt \
          -c copy \
          release/final_news_video.mp4
    
        echo "Selesai."

    - name: Upload Final Video and Metadata Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: final-news-production-pack
        path: |
          release/final_news_video.mp4
          output/analysis.json
        retention-days: 7
