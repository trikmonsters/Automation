name: Test Download & Debug Screenshot

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video Media / Instagram'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  test-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright Dependencies
        run: |
          npm init -y
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install chromium --with-deps

      - name: Download Video & Take Debug Screenshots
        run: |
          cat << 'EOF' > download_ig.js
          const { chromium } = require('playwright-extra');
          const stealth = require('puppeteer-extra-plugin-stealth')();
          const fs = require('fs');

          chromium.use(stealth);

          (async () => {
            const igUrl = process.argv[2] || "https://instagram.com";
            console.log(`🚀 Memulai proses unduh untuk URL: ${igUrl}`);

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
              viewport: { width: 1280, height: 720 },
              locale: 'en-US'
            });
            const page = await context.newPage();

            try {
              console.log('🌐 Membuka sssinstagram.com...');
              // Menggunakan networkidle untuk memastikan seluruh script eksternal selesai dimuat
              await page.goto('https://sssinstagram.com', { waitUntil: 'networkidle', timeout: 45000 });
              
              // 📸 SCREENSHOT 1: Setelah membuka website
              await page.screenshot({ path: 'step1_homepage.png', fullPage: true });
              console.log('📸 Screenshot 1 disimpan: step1_homepage.png');

              // PERUBAHAN 1: Menggunakan selektor berbasis atribut generic agar tidak terpengaruh perubahan class CSS random
              const inputSelector = 'input[type="text"], input[placeholder*="link"], input[placeholder*="Link"], #input, input.form__input';
              console.log('⏳ Menunggu kolom input muncul...');
              await page.waitForSelector(inputSelector, { timeout: 20000 });
              
              console.log('✍️  Mengisi URL Instagram...');
              await page.fill(inputSelector, igUrl);

              console.log('⚡ Mengirim URL...');
              // PERUBAHAN 2: Beberapa web memblokir aksi 'Enter' langsung di form. Kita cari tombol submit-nya atau gunakan kombinasi click
              const submitBtnSelector = 'button[type="submit"], form button, .form__btn';
              const submitBtn = await page.$(submitBtnSelector);
              
              if (submitBtn) {
                await submitBtn.click();
              } else {
                await page.press(inputSelector, 'Enter');
              }
              
              // Tunggu proses render hasil pencarian
              await page.waitForTimeout(5000); 
              
              // 📸 SCREENSHOT 2: Setelah tombol kirim ditekan
              await page.screenshot({ path: 'step2_submitted.png', fullPage: true });
              console.log('📸 Screenshot 2 disimpan: step2_submitted.png');

              // PERUBAHAN 3: Selektor download dibuat lebih luas (mencari elemen tautan dengan teks download atau tombol unduh)
              const downloadBtnSelector = 'a[download], a.button__download, a.download-link, a[href*="dl"]';
              await page.waitForSelector(downloadBtnSelector, { timeout: 45000 });

              const downloadUrl = await page.getAttribute(downloadBtnSelector, 'href');
              console.log(`🔗 Link video didapatkan! Mengunduh dari: ${downloadUrl}`);

              const response = await context.request.get(downloadUrl);
              const videoBuffer = await response.body();

              fs.writeFileSync('video.mp4', videoBuffer);
              console.log('✅ Video disimpan sebagai video.mp4');

            } catch (error) {
              console.error('❌ Gagal mengunduh video:', error.message);
              
              // 📸 SCREENSHOT ERROR: Jika proses gagal di tengah jalan
              try {
                await page.screenshot({ path: 'step_error.png', fullPage: true });
                console.log('📸 Screenshot Error disimpan: step_error.png');
              } catch (ssError) {
                console.error('⚠️ Gagal mengambil screenshot error:', ssError.message);
              }
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF
          node download_ig.js "${{ github.event.inputs.video_url }}"

      - name: Delete old debug release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🗑️ Memeriksa dan menghapus release lama jika ada..."
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name == "test_debug_assets") | .id' 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID || true
            sleep 2
          fi
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/test_debug_assets || true
          sleep 2

      - name: Upload elements to GitHub Release (Tanpa Zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Membuat GitHub Release baru untuk aset debug..."
          gh release create test_debug_assets \
            --repo "${{ github.repository }}" \
            --title "Debug & Test Assets" \
            --notes "Aset hasil pengujian unduhan dan screenshot otomatis."
            
          for file in step1_homepage.png step2_submitted.png step_error.png video.mp4; do
            if [ -f "$file" ]; then
              echo "📤 Mengunggah $file..."
              gh release upload test_debug_assets "$file" --repo "${{ github.repository }}"
            else
              echo "ℹ️ File $file tidak ditemukan (dilewati)."
            fi
          done
          echo "✅ Semua aset berhasil diunggah ke Release!"
