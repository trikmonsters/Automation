name: Parallel Multi-Web Download & Debug

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video Media / Instagram'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  # Job Awal: Membersihkan rilis aset lama agar tidak menumpuk sebelum proses paralel dimulai
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old debug release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🗑️ Memeriksa dan menghapus release lama jika ada..."
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name == "test_debug_assets") | .id' 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID || true
            sleep 2
          fi
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/test_debug_assets || true
          
          echo "📦 Membuat Wadah GitHub Release Baru..."
          gh release create test_debug_assets \
            --repo "${{ github.repository }}" \
            --title "Debug & Test Assets (Parallel Mode)" \
            --notes "Aset dikumpulkan secara real-time dari beberapa web target."

  # Job Utama: Dijalankan secara PARALEL memanfaatkan matriks GitHub Actions
  download-engine:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Memastikan jika 1 web error/timeout, web lain TIDAK ikut dibatalkan
      matrix:
        source: [
          {
            id: "indown",
            name: "indown.io",
            url: "https://indown.io/reels",
            input: "input#link, input[type='url'], input[type='text']",
            button: "button#get-btn, button[type='submit']",
            download: ".btn-group-vertical a, .btn-group-vertical button, a[href*='cdninstagram.com'], a[href*='indown.io/fetch']"
          },
          {
            id: "downreels",
            name: "downreels.com",
            url: "https://downreels.com/",
            input: "input[placeholder*='Instagram'], input[type='text'], #url",
            button: "button[type='submit'], form button, #download-btn",
            download: "#downloadLinks .btn-dl-overlay-main, #downloadLinks button, .btn-dl-overlay-main, a.download-button"
          },
          {
            id: "snapinsta",
            name: "snapinsta.to",
            url: "https://snapinsta.to/en45/instagram-reels-downloader",
            input: "input#url, input[type='text']",
            button: "button#btn-download, button[type='submit']",
            download: "a.btn-premium, a.download-media, a[title='Download Video'], a.is-success"
          },
          {
            id: "saveclip",
            name: "saveclip.app",
            url: "https://saveclip.app/en8/instagram-reels-video-download",
            input: "input#s_input, input[type='text']",
            button: "button.btn-red, button[type='submit']",
            download: "a.btn-premium, a.download-link, a[title='Download Video']"
          },
          {
            id: "fastdl",
            name: "fastdl.app",
            url: "https://fastdl.app",
            input: "input#search-form-input, input[type='text']",
            button: "button#search-form-btn, button[type='submit']",
            // Ditargetkan langsung menggunakan elemen class spesifik dan pola url media.fastdl.app Anda
            download: "a.button.button--filled.button__download, a.button__download, a[href*='media.fastdl.app/get'], .download-items-links a"
          }
        ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright Dependencies
        run: |
          npm init -y
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install chromium --with-deps

      - name: Execute Download In Incognito
        run: |
          cat << 'EOF' > run_download.js
          const { chromium } = require('playwright-extra');
          const stealth = require('puppeteer-extra-plugin-stealth')();
          const fs = require('fs');

          chromium.use(stealth);

          (async () => {
            const igUrl = process.argv[2] || "";
            const srcId = process.argv[3];
            const srcUrl = process.argv[4];
            const srcInput = process.argv[5];
            const srcButton = process.argv[6];
            const srcDownload = process.argv[7];

            console.log(`🚀 [${srcId}] Memulai pemicu unduh: ${igUrl}`);

            // Paksa flag incognito murni level sistem
            const browser = await chromium.launch({ 
              headless: true,
              args: ['--incognito', '--no-sandbox', '--disable-setuid-sandbox', '--disable-infobars']
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
              viewport: { width: 1366, height: 768 },
              locale: 'en-US',
              extraHTTPHeaders: { 'Accept-Language': 'en-US,en;q=0.9' }
            });

            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              Object.defineProperty(navigator, 'plugins', { get: () => [1, 2, 3, 4, 5] });
            });

            const page = await context.newPage();
            let downloadSuccess = false;

            try {
              await page.goto(srcUrl, { waitUntil: 'domcontentloaded', timeout: 35000 });
              await page.screenshot({ path: `step1_homepage_${srcId}.png`, fullPage: true });

              await page.waitForSelector(srcInput, { timeout: 15000 });
              await page.fill(srcInput, igUrl);

              const submitBtn = await page.$(srcButton);
              if (submitBtn) { await submitBtn.click(); } else { await page.press(srcInput, 'Enter'); }

              // Jeda render awal sebelum tangkapan layar kedua
              await page.waitForTimeout(12000);
              await page.screenshot({ path: `step2_submitted_${srcId}.png`, fullPage: true });

              // Menunggu pemuatan tautan video (Maks 60 Detik untuk Server Rendering berat)
              console.log(`⏳ Menunggu tautan unduhan dirender (Maks 60 detik)...`);
              await page.waitForSelector(srcDownload, { timeout: 60000 });

              const downloadElement = await page.$(srcDownload);
              let downloadUrl = "";
              const tagName = await page.evaluate(el => el.tagName.toLowerCase(), downloadElement);

              // Logika Intersepsi jika element berupa tombol/bukan tautan langsung
              if (tagName === 'button' || tagName === 'div') {
                downloadUrl = await page.evaluate(el => {
                  const anchor = el.closest('a') || el.querySelector('a');
                  return anchor ? anchor.href : el.getAttribute('data-url') || el.getAttribute('data-href');
                }, downloadElement);

                if (!downloadUrl) {
                  console.log(`🔄 Target berupa tombol tanpa href, merekam stream via klik langsung...`);
                  const [downloadEvent] = await Promise.all([
                    page.waitForEvent('download', { timeout: 45000 }),
                    downloadElement.click()
                  ]);
                  await downloadEvent.saveAs(`video_${srcId}.mp4`);
                  downloadSuccess = true;
                }
              } else {
                downloadUrl = await page.getAttribute(srcDownload, 'href');
              }

              if (downloadUrl && !downloadSuccess) {
                console.log(`🔗 Link video didapatkan. Mendownload stream data...`);
                const response = await context.request.get(downloadUrl, { timeout: 45000 });
                const videoBuffer = await response.body();
                fs.writeFileSync(`video_${srcId}.mp4`, videoBuffer);
                downloadSuccess = true;
              }

              if (downloadSuccess) {
                console.log(`✅ Selesai! File video_${srcId}.mp4 sukses ditulis.`);
              }

            } catch (error) {
              console.error(`❌ Gangguan pada ${srcId}:`, error.message);
              try { await page.screenshot({ path: `step_error_${srcId}.png`, fullPage: true }); } catch (e) {}
            } finally {
              await context.close();
              await browser.close();
            }
          })();
          EOF
          node run_download.js "${{ github.event.inputs.video_url }}" "${{ matrix.source.id }}" "${{ matrix.source.url }}" "${{ matrix.source.input }}" "${{ matrix.source.button }}" "${{ matrix.source.download }}"

      - name: Upload Runner Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for file in *.png video_${{ matrix.source.id }}.mp4; do
            if [ -f "$file" ]; then
              echo "📤 Memasukkan $file ke dalam rilis..."
              gh release upload test_debug_assets "$file" --repo "${{ github.repository }}" --clobber
            fi
          done
