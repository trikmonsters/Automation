name: Parallel Multi-Web Download & Debug

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Masukkan URL Video Media / Instagram'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old debug release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🗑️ Memeriksa dan menghapus release lama jika ada..."
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name == "test_debug_assets") | .id' 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID || true
            sleep 2
          fi
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/test_debug_assets || true
          
          echo "📦 Membuat Wadah GitHub Release Baru..."
          gh release create test_debug_assets \
            --repo "${{ github.repository }}" \
            --title "Debug & Test Assets (Parallel Mode)" \
            --notes "Aset dikumpulkan secara real-time dari beberapa web target."

  download-engine:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source:
          - id: "indown"
            name: "indown.io"
            url: "https://indown.io/reels"
            input: "input#link, input[name='link'], input[type='url']"
            button: "button#get-btn, button[type='submit'], #get-btn"
            download: "a[href*='cdninstagram.com'], a[href*='fetch'], .btn-group-vertical a, text=/Download/i"

          - id: "downreels"
            name: "downreels.com"
            url: "https://downreels.com/"
            input: "input[placeholder*='Instagram'], input[type='text'], #url"
            button: "button[type='submit'], form button, #download-btn"
            download: "#downloadLinks a, a.download-button, text=/Download/i"

          - id: "snapinsta"
            name: "snapinsta.to"
            url: "https://snapinsta.to/en45/instagram-reels-downloader"
            input: "input#url, input[type='text']"
            button: "button#btn-download, button[type='submit']"
            download: "a.download-media, a.btn-premium, a[title='Download Video'], text=/Download Video/i"

          - id: "saveclip"
            name: "saveclip.app"
            url: "https://saveclip.app/en8/instagram-reels-video-download"
            input: "input#s_input, input[type='text']"
            button: "button.btn-red, button[type='submit']"
            download: "a.download-link, a.btn-premium, text=/Download Video/i"

          - id: "fastdl"
            name: "fastdl.app"
            url: "https://fastdl.app"
            input: "input#search-form-input, input[type='text']"
            button: "button#search-form-btn, button[type='submit']"
            download: "a.button.button--filled.button__download, a.button__download, a[href*='media.fastdl.app/get'], text=/Download/i"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright Dependencies
        run: |
          npm init -y
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install chromium --with-deps

      - name: Execute Download In Incognito
        run: |
          cat << 'EOF' > run_download.js
          const { chromium } = require('playwright-extra');
          const stealth = require('puppeteer-extra-plugin-stealth')();
          const fs = require('fs');

          chromium.use(stealth);

          (async () => {
            const igUrl = process.argv[2] || "";
            const srcId = process.argv[3];
            const srcUrl = process.argv[4];
            const srcInput = process.argv[5];
            const srcButton = process.argv[6];
            const srcDownload = process.argv[7];

            console.log(`🚀 [${srcId}] Memulai pemicu unduh: ${igUrl}`);

            const browser = await chromium.launch({ 
              headless: true,
              args: [
                '--incognito', 
                '--no-sandbox', 
                '--disable-setuid-sandbox', 
                '--disable-infobars',
                '--disable-blink-features=AutomationControlled'
              ]
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
              viewport: { width: 1366, height: 768 },
              locale: 'en-US',
              extraHTTPHeaders: { 'Accept-Language': 'en-US,en;q=0.9' }
            });

            const page = await context.newPage();
            let downloadSuccess = false;

            try {
              // Set timeout navigasi awal yang longgar
              await page.goto(srcUrl, { waitUntil: 'networkidle', timeout: 45000 });
              await page.screenshot({ path: `step1_homepage_${srcId}.png`, fullPage: true });

              // Tunggu kolom input siap
              await page.waitForSelector(srcInput, { timeout: 20000 });
              await page.focus(srcInput);
              
              // EMULASI MANUSIA: Ketik URL perlahan untuk mengecoh deteksi bot
              for (const char of igUrl) {
                await page.keyboard.type(char, { delay: Math.floor(Math.random() * 30) + 10 });
              }
              await page.waitForTimeout(1000);

              // Cari tombol submit
              const submitBtn = await page.$(srcButton);
              if (submitBtn) {
                await submitBtn.hover();
                await page.waitForTimeout(500);
                await submitBtn.click();
              } else {
                await page.press(srcInput, 'Enter');
              }

              // Memberikan waktu ekstra bagi server untuk memproses video & meloloskan verifikasi background
              console.log(`⏳ Menunggu proses konversi server (Maks 60 detik)...`);
              await page.waitForTimeout(15000);
              await page.screenshot({ path: `step2_submitted_${srcId}.png`, fullPage: true });

              // Menanti tombol download muncul di halaman halaman
              await page.waitForSelector(srcDownload, { timeout: 45000 });
              const downloadElement = await page.$(srcDownload);
              
              if (downloadElement) {
                const tagName = await page.evaluate(el => el.tagName.toLowerCase(), downloadElement);
                
                // Pendekatan Utama: Klik Alami Browser (Meloloskan Cookie/Token Fastdl & Indown)
                try {
                  console.log(`🔄 Mengemulasikan klik pada elemen download [${tagName}]...`);
                  await downloadElement.hover();
                  
                  const [downloadEvent] = await Promise.all([
                    page.waitForEvent('download', { timeout: 60000 }),
                    downloadElement.click({ force: true })
                  ]);
                  
                  await downloadEvent.saveAs(`video_${srcId}.mp4`);
                  downloadSuccess = true;
                  console.log(`✅ Sukses! video_${srcId}.mp4 berhasil disimpan via Event Browser.`);
                } catch (clickError) {
                  console.log(`⚠️ Klik langsung gagal/tidak memicu stream berkas. Menjalankan metode ekstraksi URL...`);
                }

                // Pendekatan Cadangan: Ekstraksi tautan manual jika klik langsung terhalang iklan
                if (!downloadSuccess) {
                  let downloadUrl = await page.evaluate(el => {
                    const anchor = el.closest('a') || el.querySelector('a');
                    return anchor ? anchor.href : el.getAttribute('href') || el.getAttribute('data-url');
                  }, downloadElement);

                  if (downloadUrl && downloadUrl.startsWith('http')) {
                    console.log(`🔗 Link alternatif ditemukan. Mengunduh via halaman isolasi baru...`);
                    const downloadPage = await context.newPage();
                    try {
                      const [downloadEvent] = await Promise.all([
                        downloadPage.waitForEvent('download', { timeout: 60000 }),
                        downloadPage.goto(downloadUrl).catch(() => {})
                      ]);
                      await downloadEvent.saveAs(`video_${srcId}.mp4`);
                      downloadSuccess = true;
                      console.log(`✅ Sukses! video_${srcId}.mp4 ditulis via Halaman Isolasi.`);
                    } catch (err) {
                      console.error(`❌ Seluruh metode pengunduhan gagal pada tautan ini:`, err.message);
                    } finally {
                      await downloadPage.close();
                    }
                  }
                }
              }

            } catch (error) {
              console.error(`❌ Gangguan pada mesin ${srcId}:`, error.message);
              try { await page.screenshot({ path: `step_error_${srcId}.png`, fullPage: true }); } catch (e) {}
            } finally {
              await context.close();
              await browser.close();
            }
          })();
          EOF
          node run_download.js "${{ github.event.inputs.video_url }}" "${{ matrix.source.id }}" "${{ matrix.source.url }}" "${{ matrix.source.input }}" "${{ matrix.source.button }}" "${{ matrix.source.download }}"

      - name: Upload Runner Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for file in *.png video_${{ matrix.source.id }}.mp4; do
            if [ -f "$file" ]; then
              echo "📤 Memasukkan $file ke dalam rilis..."
              gh release upload test_debug_assets "$file" --repo "${{ github.repository }}" --clobber
            fi
          done
