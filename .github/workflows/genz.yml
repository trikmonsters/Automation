name: Upload Gen Z

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        required: true
        type: string
      upload_tiktok:
        required: false
        default: "true"
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install chromium --with-deps

      - name: Run Playwright Script
        env:
          YOUTUBE_URL: ${{ github.event.inputs.youtube_url }}
        run: |
          cat << 'EOF' > script.js
          const { chromium } = require('playwright-extra');
          const stealth = require('puppeteer-extra-plugin-stealth')();
          chromium.use(stealth);
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const targetUrl = process.env.YOUTUBE_URL;
            if (!targetUrl) {
              console.error("Error: YOUTUBE_URL is missing from environment variables.");
              process.exit(1);
            }

            const browser = await chromium.launch({ 
              headless: true,
              args: [
                '--no-sandbox', 
                '--disable-setuid-sandbox',
                '--disable-blink-features=AutomationControlled'
              ]
            });

            const context = await browser.newContext({
              viewport: { width: 1280, height: 1000 },
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, Gecko) Chrome/122.0.0.0 Safari/537.36',
              locale: 'en-US'
            });

            const page = await context.newPage();

            try {
              // Menuju halaman antarmuka web AI target Anda
              await page.goto('https://www.google.com/aimode', { waitUntil: 'networkidle' });
              
              const chatInput = page.locator('textarea.ITIRGe, textarea[placeholder*="Ask"], textarea[placeholder*="Tanyakan"]').first();
              await chatInput.waitFor({ state: 'visible', timeout: 15000 });

              // Prompt Bahasa Inggris yang dioptimalkan dengan teknik Few-Shot & Strict Constraints
              const prompt = `Role: Elite Music Video Analyst & SEO Metadata Architect.

              Task: Extract and generate precise metadata from the provided YouTube Short URL.
              
              Constraints (Violating any will cause failure):
              1. Output MUST consist of exactly three (3) lines of plain text. 
              2. Do NOT use markdown code blocks (\`\`\`), JSON formatting, or HTML tags.
              3. Do NOT include intro/outro conversational filler (e.g., "Sure, here is...", "Hope this helps!").
              4. Output raw text ONLY.
              
              Metadata Rules:
              - Line 1 (Title): Format must be exactly "[Song Name] - [Artist Name]". Absolutely NO promotional buzzwords, emojis, or platform tags (e.g., DO NOT include: Official Video, Lyric Video, HD, 4K, Viral). Keep original spelling and casing.
              - Line 2 (Description): Extract the most recognizable, catchy core phrase from the chorus/refrain. Max 15 words. If the song cannot be verified with 100% confidence, generate a strict 1-sentence analytical summary of the video's core visual theme instead. No CTAs, hashtags, or links.
              - Line 3 (Tags): Exactly 4 hashtags in this exact order: #[SongName] #[ArtistName] #[MainGenre] #[VisualStyle/Vibe]. Remove all spaces within the hashtags (e.g., #BillieEilish).
              
              Fallback Rule:
              If the song is unidentifiable or anonymous background music, base all 3 lines completely on the visual content, topic, or main theme of the video.
              
              Example Output (Strictly match this layout):
              Birds of a Feather - Billie Eilish
              I'll love you 'til the day that I die
              #BirdsOfAFeather #BillieEilish #AlternativePop #Aesthetic
              
              Target Video URL: ${targetUrl}`;

              await chatInput.fill(prompt);
              await chatInput.press('Enter');
              
              console.log("Waiting for AI response layers...");
              
              let finalOutputText = "";
              const startTime = Date.now();
              const timeoutLimit = 60000; // Batas tunggu maksimal 1 menit

              while (Date.now() - startTime < timeoutLimit) {
                const bodyText = await page.evaluate(() => document.body.innerText);
                
                // Pisahkan string berdasarkan baris dan cari baris yang memuat struktur tag (#)
                const lines = bodyText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const hashLineIdx = lines.findIndex(l => l.startsWith('#'));

                // Jika baris ber-hashtag ditemukan dan memiliki minimal 2 baris di atasnya (Title & Desc)
                if (hashLineIdx >= 2) {
                  const title = lines[hashLineIdx - 2];
                  const desc = lines[hashLineIdx - 1];
                  const tags = lines[hashLineIdx];
                  
                  finalOutputText = `${title}\n${desc}\n${tags}`;
                  break;
                }
                await page.waitForTimeout(3000);
              }

              // Fallback sistem jika web scraping gagal menangkap respons terstruktur
              if (!finalOutputText) {
                console.log("Warning: Failed to parse structured text. Using safe fallback metadata.");
                finalOutputText = "Trending Track - Sound Synthesis\nDiscover the modern beat and aesthetic visuals of this short.\n#TrendingTrack #SoundSynthesis #Electronic #Aesthetic";
              }

              console.log("\n=================== AI GENERATED METADATA ===================");
              console.log(finalOutputText);
              console.log("===============================================================\n");

              const outputLines = finalOutputText.split('\n');
              const finalTitle = outputLines[0] || "Untitled";
              const finalDesc = outputLines[1] || "";
              const finalTags = outputLines[2] || "";

              // Eksport data ke $GITHUB_ENV agar bisa diakses oleh step upload di bawahnya
              fs.appendFileSync(process.env.GITHUB_ENV, `GEMINI_TITLE=${finalTitle}\n`);
              fs.appendFileSync(process.env.GITHUB_ENV, `GEMINI_DESCRIPTION=${finalDesc}\n`);
              fs.appendFileSync(process.env.GITHUB_ENV, `GEMINI_TAGS=${finalTags}\n`);
              
              // Menyusun gabungan teks (caption lengkap) untuk kebutuhan payload Buffer TikTok
              fs.appendFileSync(process.env.GITHUB_ENV, "TIKTOK_CAPTION<<EOF_CAPTION\n");
              fs.appendFileSync(process.env.GITHUB_ENV, `${finalTitle}\n\n${finalDesc}\n${finalTags}\n`);
              fs.appendFileSync(process.env.GITHUB_ENV, "EOF_CAPTION\n");

              // Simulasi pembuatan placeholder video jika file tidak diproduksi di step sebelumnya
              const placeholderFile = "video-processed.mp4";
              if (!fs.existsSync(placeholderFile)) {
                fs.writeFileSync(placeholderFile, "dummy video data container");
              }
              fs.appendFileSync(process.env.GITHUB_ENV, `OUTPUT_FILE=${placeholderFile}\n`);

            } catch (error) {
              console.error("Automation Critical Error:", error.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF
          node script.js

      - name: Delete old release
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name == "genz") | .id' \
            2>/dev/null || echo "")

          if [ -n "$RELEASE_ID" ]; then
            gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID
            sleep 2
            gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/genz || true
            sleep 2
          fi

      - name: Upload video to GitHub Release
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create genz \
            --repo "${{ github.repository }}" \
            --title "Gen Z TikTok Video" \
            --notes "Temporary hosting for Buffer API" \
            "${{ env.OUTPUT_FILE }}"

      - name: Get video URL from release
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          VIDEO_URL=$(gh api repos/${{ github.repository }}/releases/tags/genz \
            --jq '.assets[0].browser_download_url')
          echo "VIDEO_URL=${VIDEO_URL}" >> $GITHUB_ENV

      - name: Upload TikTok via Buffer API
        if: ${{ github.event.inputs.upload_tiktok == 'true' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: "6a2ef6a438b557934595f88c"
          VIDEO_URL: ${{ env.VIDEO_URL }}
          TIKTOK_CAPTION: ${{ env.TIKTOK_CAPTION }}
        run: |
          python3 - <<'PYEOF'
          import os
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          caption = os.environ.get("TIKTOK_CAPTION", "")
          due_at = (datetime.now(timezone.utc) + timedelta(minutes=1)).strftime("%Y-%m-%dT%H:%M:%S.000Z")

          mutation = (
              "mutation { createPost(input: {"
              "text: " + json.dumps(caption) +
              " channelId: " + json.dumps(os.environ['BUFFER_CHANNEL_ID']) +
              " schedulingType: automatic"
              " mode: customScheduled"
              " dueAt: " + json.dumps(due_at) +
              " assets: [{ video: { url: " + json.dumps(os.environ['VIDEO_URL']) + " } }]"
              "}) {"
              " ... on PostActionSuccess { post { id } }"
              " ... on MutationError { message }"
              "} }"
          )

          req = urllib.request.Request(
              "https://api.buffer.com/graphql",
              data=json.dumps({"query": mutation}).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["BUFFER_API_KEY"]
              }
          )
          print(urllib.request.urlopen(req).read().decode())
          PYEOF
